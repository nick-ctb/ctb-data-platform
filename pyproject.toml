[project]
name = "ctb"
version = "0.1.0"
description = "End-to-end data engineering platform for a fictional South African digital bank, built locally at R0.00."
readme = "README.md"
authors = [
    { name = "Nick Hendrikse", email = "358301210+nick-ctb@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
ctb = "ctb:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
